# Source of truth for routing. render.py turns this into litellm-config.yaml.
# Holds no credentials: key_env names an environment variable.
compression:
  enabled: true
  api_base: http://127.0.0.1:8787
  timeout: 15
  unreachable_fallback: fail_open
providers:
  relay-fast:
    key_env: RELAY_FAST_API_KEY
    chat_base: https://relay.fast/v1
    messages_base: https://relay.fast
timeouts:
  request: 120
  stream: 120
  total: 300
  retries: 1
  cooldown: 5
aliases:
- name: claude-3-5-sonnet-20241022
  deployments:
  - provider: relay-fast
    model: kimi-k3
    dialect: openai
    order: 1
  fallbacks:
  - claude-3-5-haiku-20251011
  - claude-3-5-haiku-202609122
  model_info:
    supports_function_calling: true
- name: claude-3-opus-20240229
